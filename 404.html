<html lang="en">

        .card { background: rgba(255,255,255,.75); border: 1px solid #ffb066; border-radius: 14px;
                padding: 36px 44px; box-shadow: 0 0 30px rgba(255,176,102,.25); max-width: 32rem; }

        p { line-height: 1.8; }
        a { color: #ff8c42; font-weight: 600; }
        a:focus-visible { outline: 3px solid #5a3a22; outline-offset: 3px; }
    </style>
